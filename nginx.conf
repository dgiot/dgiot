# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes  1;
error_log /data/dgiot/nginx/logs/error.log;
pid /run/nginx.pid;

events {
    worker_connections  1024;
}
# tcp反代理
stream{
    upstream mqtt{
     #这里代理本地mqtt，其端口是1883
    server 127.0.0.1:1883;
    }
    server {
           #监听18883端口
           listen 18883;
           proxy_pass mqtt;
     }
}

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
# include /usr/share/nginx/modules/*.conf;

http {
    client_max_body_size 100m;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /data/dgiot/nginx/logs/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /data/dgiot/nginx/conf/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
	server {
        listen       2089;
        server_name  prod.iotn2n.com;
    }
    server {
			listen 28083;
	        location / {
	            proxy_set_header X-Real-IP $remote_addr;                       
                            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                            proxy_buffer_size  128k;
                            proxy_buffers   32 32k;
                            proxy_busy_buffers_size 128k;
                            proxy_pass http://127.0.0.1:18083;
			}
    }
    server {
	        listen 11337;
	        location /dashboard {
	            proxy_set_header X-Real-IP $remote_addr;                       
                            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                            proxy_buffer_size  128k;
                            proxy_buffers   32 32k;
                            proxy_busy_buffers_size 128k;
                            proxy_pass http://127.0.0.1:1337;
			}
	}
	
	# Settings for a TLS enabled server.
     server {
        listen 443 ssl;
		#你的申请过证书的域名 例如 prod.iotn2n.com
        server_name prod.iotn2n.com; 
        client_max_body_size 64M;
        fastcgi_read_timeout 3600;
        error_page   500 502 503 504  /50x.html;
        try_files $uri $uri/ @rewrite;
		# 证书pem文件，根据自己证书的所在位置
        ssl_certificate /etc/ssl/certs/fullchain.pem; 
		# 证书key文件，根据自己证书的所在位置
        ssl_certificate_key /etc/ssl/certs/privkey.key;   
        ssl_session_timeout 5m;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2; #按照这个协议配置
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;#按照这个套件配置
        ssl_prefer_server_ciphers on;
        gzip on;
        gzip_buffers 32 4K;
        gzip_comp_level 6;
        gzip_min_length 100;
        gzip_types text/plain application/x-javascript text/css application/xml text/javascript application/javascript image/svg+xml application/json;
        gzip_disable "MSIE [1-6]\."; #配置禁用gzip条件，支持正则。此处表示ie6及以下不启用gzip（因为ie低版本不支持）
        gzip_vary on;

        location /iotapi {
		                    proxy_set_header X-Real-IP $remote_addr;                       
                            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                            proxy_buffer_size  128k;
                            proxy_buffers   32 32k;
                            proxy_busy_buffers_size 128k;
                            proxy_pass http://127.0.0.1:5080;
        }
		location /swagger {
	                        proxy_set_header X-Real-IP $remote_addr;                       
                            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                            proxy_buffer_size  128k;
                            proxy_buffers   32 32k;
                            proxy_busy_buffers_size 128k;
                            proxy_pass http://127.0.0.1:5080;
        }
		location /dgiot_swagger {
		                    proxy_set_header X-Real-IP $remote_addr;                       
                            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                            proxy_buffer_size  128k;
                            proxy_buffers   32 32k;
                            proxy_busy_buffers_size 128k;
                            proxy_pass http://127.0.0.1:1250;
        }
        location /excelController {
		                    proxy_set_header X-Real-IP $remote_addr;                       
                            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                            proxy_buffer_size  128k;
                            proxy_buffers   32 32k;
                            proxy_busy_buffers_size 128k;
                            proxy_pass http://127.0.0.1:8012;
        }
        location /mqtt {
		                    proxy_set_header X-Real-IP $remote_addr;                       
                            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                            proxy_buffer_size  128k;
                            proxy_buffers   32 32k;
                            proxy_busy_buffers_size 128k;
                            proxy_pass http://127.0.0.1:8084/mqtt;
        }
        location /upload{
		                    proxy_set_header X-Real-IP $remote_addr;                       
                            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                            proxy_buffer_size  128k;
                            proxy_buffers   32 32k;
                            proxy_busy_buffers_size 128k;
                            proxy_pass http://127.0.0.1:1250;
        }
        location /dgiot_file{
		                    proxy_set_header X-Real-IP $remote_addr;                       
                            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                            proxy_buffer_size  128k;
                            proxy_buffers   32 32k;
                            proxy_busy_buffers_size 128k;
                            proxy_pass http://127.0.0.1:1250/dgiot_file;
        }
        location /dgiot_dashboard {
		                    proxy_set_header X-Real-IP $remote_addr;                       
                            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                            proxy_buffer_size  128k;
                            proxy_buffers   32 32k;
                            proxy_busy_buffers_size 128k;
                            proxy_pass http://127.0.0.1:1250;
        }
        location /dgiot_grafana{
		                    proxy_set_header X-Real-IP $remote_addr;                     
                            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                            proxy_buffer_size  128k;
                            proxy_buffers   32 32k;
                            proxy_busy_buffers_size 128k;
                            proxy_pass http://127.0.0.1:3000;
        }
        location /dgiot_metrics {
		                    proxy_set_header X-Real-IP $remote_addr;                       
                            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                            proxy_buffer_size  128k;
                            proxy_buffers   32 32k;
                            proxy_busy_buffers_size 128k;
                            proxy_pass http://127.0.0.1:5080/metrics/dgiot;
        }		
    }

